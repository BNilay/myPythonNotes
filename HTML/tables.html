<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables & Forms</title>
</head>
<body>
    <table border=1>
        <!-- table head -->
        <thead>
            <th>Name</th>
            <th>Salary</th>
            <th>Department</th>
            <th>Age</th>
        </thead>
        <!-- table row -->
        <tr>
            <td>James</td>
            <td>100</td>
            <td>Musician</td>
            <td>60</td>
        </tr>
    </table>

    <br><br><br>

    <form action="images.html">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name">
        <br>
        <label for="salary">Salary: </label>
        <input type="text" id="salary" name="salary" >
        <br>
        <input type="submit">
    </form>

    <form action="htmlbasics.html">
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br>
        <label for="passw">Passw: </label>
        <input type="password" id="passw" name="passw" >
        <br>
        <input type="submit" value="Login">
    </form>
    
    <form action="div_span.html">
        <p>Star Wars vs Star Trek</p>
        <label for="starwars">starwars </label>
        <input type="radio" id="starwars" name="movie" value="starwars" >
        <br>
        <label for="startrek">Startrek:</label>
        <input type="radio" id="startrek>" name="movie" value="startrek">
        <br>
        <input type="submit" value="Choose">
    </form>

    <form action="html_list.html">
        <select>
            <option>1</option>
             <option>2</option>
             <option>3</option>
             <option>4</option>
             <option>5</option>
        </select>
        <br>
        <input type="submit" value="Choose">
    </form>     

</body>
</html>
